<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d1b2a">
<title>Emberline</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100vh; height: 100dvh;
    overflow: hidden; background: #0d1b2a;
    font-family: system-ui, -apple-system, sans-serif;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: none; overscroll-behavior: none;
  }
  /* width/height are NOT redundant with inset: 0. A canvas is a REPLACED
     element, so with width:auto it uses its intrinsic size and ignores the
     inset box entirely. Without these, the canvas renders at its intrinsic
     300x150 and src/render/scene.js sizes the drawing buffer from its own
     previous output -- a feedback loop, not a viewport. */
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #ui {
    position: fixed; pointer-events: none;
    inset: env(safe-area-inset-top) env(safe-area-inset-right)
           env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  #rotate-overlay { display: none; }
  @media (orientation: landscape) {
    #rotate-overlay {
      display: flex; position: fixed; inset: 0; z-index: 1000;
      align-items: center; justify-content: center; text-align: center;
      background: #0d1b2a; color: #eaf2fa;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 5vmin; padding: 4vmin;
      pointer-events: auto;
    }
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="ui"></div>
<div id="rotate-overlay">Rotate your device to portrait</div>
<script src="./vendor/three.js"></script>
<script>
/*__GAME_CODE__*/
</script>
</body>
</html>
